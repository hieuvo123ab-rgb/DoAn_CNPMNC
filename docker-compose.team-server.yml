# EDMS standalone team server. All volumes are NEW and isolated from Docker/Railway EDMS.
# Start locally: docker compose --env-file .env.team-server -f docker-compose.team-server.yml up -d --build
# Publish HTTPS: docker compose --env-file .env.team-server -f docker-compose.team-server.yml --profile remote up -d
name: edms_team_server

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edms_team_db
      POSTGRES_USER: edms_team_user
      POSTGRES_PASSWORD: ${EDMS_DB_PASSWORD:?Set a random EDMS_DB_PASSWORD in .env.team-server}
    volumes:
      - team_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edms_team_user -d edms_team_db"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks: [database]

  web:
    build:
      context: .
      dockerfile: Dockerfile.team-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Never expose an unencrypted HTTP login to the public Internet.
      # Remote users enter through the HTTPS Cloudflare Tunnel instead.
      - "127.0.0.1:8088:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod,team-server
      EDMS_TEAM_SERVER_ENABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/edms_team_db
      SPRING_DATASOURCE_USERNAME: edms_team_user
      SPRING_DATASOURCE_PASSWORD: ${EDMS_DB_PASSWORD:?}
      EDMS_JWT_SECRET: ${EDMS_JWT_SECRET:?}
      EDMS_KEYSTORE_PASSWORD: ${EDMS_KEYSTORE_PASSWORD:?}
      EDMS_TEAM_ADMIN_USERNAME: ${EDMS_TEAM_ADMIN_USERNAME:-team_admin}
      EDMS_TEAM_ADMIN_PASSWORD: ${EDMS_TEAM_ADMIN_PASSWORD:?}
      EDMS_STORAGE_DIR: /app/persist/uploads
      EDMS_KEYSTORE_PATH: /app/persist/keys/edms-signing.p12
      EDMS_FAILURE_SIMULATION_ENABLED: "false"
      EDMS_WEBSOCKET_ALLOWED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088,${EDMS_PUBLIC_ORIGIN:?}
      EDMS_HTTP_ALLOWED_ORIGINS: ${EDMS_PUBLIC_ORIGIN:?}
      EDMS_HIKARI_MAX_POOL_SIZE: "10"
      EDMS_HIKARI_MIN_IDLE: "2"
    volumes:
      - team_appdata:/app/persist
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 120s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks: [database, public_edge]

  tunnel:
    profiles: [remote]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Cloudflared reads this environment variable; do not put token in CLI flags.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    networks: [public_edge]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  database:
    internal: true
  public_edge:
    driver: bridge

volumes:
  team_pgdata:
    name: edms_team_server_pgdata
  team_appdata:
    name: edms_team_server_appdata

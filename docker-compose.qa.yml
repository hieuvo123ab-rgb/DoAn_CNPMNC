# EDMS Dedicated QA Docker Environment
# All volumes and projects are completely isolated from Production, Railway, and Team Server.
name: edms_qa_env

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edms_team_db
      POSTGRES_USER: edms_team_user
      POSTGRES_PASSWORD: ${EDMS_DB_PASSWORD:?Set EDMS_DB_PASSWORD in .env.qa}
    volumes:
      - qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edms_team_user -d edms_team_db"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks: [database]

  web:
    build:
      context: .
      dockerfile: Dockerfile.team-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod,team-server
      EDMS_TEAM_SERVER_ENABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/edms_team_db
      SPRING_DATASOURCE_USERNAME: edms_team_user
      SPRING_DATASOURCE_PASSWORD: ${EDMS_DB_PASSWORD:?}
      EDMS_JWT_SECRET: ${EDMS_JWT_SECRET:?}
      EDMS_KEYSTORE_PASSWORD: ${EDMS_KEYSTORE_PASSWORD:?}
      EDMS_TEAM_ADMIN_USERNAME: ${EDMS_TEAM_ADMIN_USERNAME:-qa_admin}
      EDMS_TEAM_ADMIN_PASSWORD: ${EDMS_TEAM_ADMIN_PASSWORD:?}
      EDMS_STORAGE_DIR: /app/persist/uploads
      EDMS_KEYSTORE_PATH: /app/persist/keys/edms-signing.p12
      EDMS_FAILURE_SIMULATION_ENABLED: "false"
      EDMS_WEBSOCKET_ALLOWED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      EDMS_HTTP_ALLOWED_ORIGINS: https://edms.qa.local
      EDMS_HIKARI_MAX_POOL_SIZE: "10"
      EDMS_HIKARI_MIN_IDLE: "2"
    volumes:
      - qa_appdata:/app/persist
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 8s
      retries: 15
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks: [database, public_edge]

networks:
  database:
    internal: true
  public_edge:
    driver: bridge

volumes:
  qa_pgdata:
    name: edms_qa_team_pgdata
  qa_appdata:
    name: edms_qa_team_appdata

